---
# Monitoring stack on PC Alentejo (ADR-0035): Elasticsearch, Kibana, Prometheus, Grafana.
# Run by ansible-pull inside the runner container (ADR-0025). Secrets are files outside the
# repository, in monitoring_secrets_dir; nothing here holds a secret value.

- name: Check that the secret files exist
  ansible.builtin.stat:
    path: "{{ monitoring_secrets_dir }}/{{ item }}"
  loop:
    - elastic_password
    - kibana_system_password
    - grafana_admin_password
  register: monitoring_secret_files

- name: Stop if a secret file is missing
  ansible.builtin.assert:
    that: item.stat.exists
    fail_msg: "Missing {{ item.item }} in {{ monitoring_secrets_dir }}. Run bootstrap/run-ansible-pull.ps1, which creates it."
    quiet: true
  loop: "{{ monitoring_secret_files.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Create the configuration folders
  ansible.builtin.file:
    path: "{{ monitoring_root }}/{{ item }}"
    state: directory
    mode: "0750"
  loop:
    - prometheus
    - grafana/provisioning/datasources

- name: Create the monitoring network
  containers.podman.podman_network:
    name: "{{ monitoring_network }}"
    state: present

- name: Create the data volumes
  containers.podman.podman_volume:
    name: "{{ item }}"
    state: present
  loop:
    - elasticsearch-data
    - prometheus-data
    - grafana-data

- name: Load the passwords into Podman secrets
  containers.podman.podman_secret:
    name: "{{ item }}"
    data: "{{ lookup('ansible.builtin.file', monitoring_secrets_dir ~ '/' ~ item) }}"
    state: present
    skip_existing: true
  loop:
    - elastic_password
    - kibana_system_password
    - grafana_admin_password
  no_log: true

# Elasticsearch -------------------------------------------------------------------

- name: Run Elasticsearch
  containers.podman.podman_container:
    name: elasticsearch
    image: "{{ monitoring_images.elasticsearch }}"
    state: started
    restart_policy: unless-stopped
    network:
      - "{{ monitoring_network }}"
    publish:
      - "{{ monitoring_bind_address }}:{{ monitoring_ports.elasticsearch }}:9200"
    memory: "{{ monitoring_elasticsearch_memory }}"
    volume:
      - elasticsearch-data:/usr/share/elasticsearch/data
    secrets:
      - elastic_password,type=env,target=ELASTIC_PASSWORD
    env:
      discovery.type: single-node
      xpack.security.enabled: "true"
      # TLS on the HTTP layer comes with the reverse proxy (ADR-0013); until then the port is loopback only.
      xpack.security.http.ssl.enabled: "false"
      # The Podman machine kernel may keep vm.max_map_count low; do not depend on it.
      node.store.allow_mmap: "false"
      ES_JAVA_OPTS: "-Xms{{ monitoring_elasticsearch_heap }} -Xmx{{ monitoring_elasticsearch_heap }}"

- name: Wait until Elasticsearch answers
  ansible.builtin.uri:
    url: "{{ monitoring_es_url }}/_cluster/health"
    user: elastic
    password: "{{ lookup('ansible.builtin.file', monitoring_secrets_dir ~ '/elastic_password') }}"
    force_basic_auth: true
    status_code: 200
  register: monitoring_es_health
  until: monitoring_es_health.status == 200 and monitoring_es_health.json.status in ['green', 'yellow']
  retries: 30
  delay: 10
  no_log: true

- name: Set the kibana_system password
  ansible.builtin.uri:
    url: "{{ monitoring_es_url }}/_security/user/kibana_system/_password"
    method: POST
    user: elastic
    password: "{{ lookup('ansible.builtin.file', monitoring_secrets_dir ~ '/elastic_password') }}"
    force_basic_auth: true
    body_format: json
    body:
      password: "{{ lookup('ansible.builtin.file', monitoring_secrets_dir ~ '/kibana_system_password') }}"
    status_code: 200
  changed_when: false
  no_log: true

- name: Create the role that may only add audit records (ADR-0018 decision 4)
  ansible.builtin.uri:
    url: "{{ monitoring_es_url }}/_security/role/{{ monitoring_audit_writer_role }}"
    method: PUT
    user: elastic
    password: "{{ lookup('ansible.builtin.file', monitoring_secrets_dir ~ '/elastic_password') }}"
    force_basic_auth: true
    body_format: json
    body:
      indices:
        - names: ["{{ monitoring_audit_index }}*"]
          privileges: ["create_doc", "auto_configure"]
    status_code: 200
  changed_when: false
  no_log: true

- name: Check whether the audit ingest key was already issued
  ansible.builtin.stat:
    path: "{{ monitoring_audit_token_file }}"
  register: monitoring_audit_token

- name: Issue the write-only audit ingest key
  ansible.builtin.uri:
    url: "{{ monitoring_es_url }}/_security/api_key"
    method: POST
    user: elastic
    password: "{{ lookup('ansible.builtin.file', monitoring_secrets_dir ~ '/elastic_password') }}"
    force_basic_auth: true
    body_format: json
    body:
      name: agent-audit-ingest
      role_descriptors:
        "{{ monitoring_audit_writer_role }}":
          indices:
            - names: ["{{ monitoring_audit_index }}*"]
              privileges: ["create_doc", "auto_configure"]
    status_code: 200
  register: monitoring_audit_key
  when: not monitoring_audit_token.stat.exists
  no_log: true

- name: Store the audit ingest key outside the repository
  ansible.builtin.copy:
    content: "{{ monitoring_audit_key.json.encoded }}"
    dest: "{{ monitoring_audit_token_file }}"
    mode: "0600"
  when: not monitoring_audit_token.stat.exists
  no_log: true

# Kibana --------------------------------------------------------------------------

- name: Run Kibana
  containers.podman.podman_container:
    name: kibana
    image: "{{ monitoring_images.kibana }}"
    state: started
    restart_policy: unless-stopped
    network:
      - "{{ monitoring_network }}"
    publish:
      - "{{ monitoring_bind_address }}:{{ monitoring_ports.kibana }}:5601"
    memory: "{{ monitoring_kibana_memory }}"
    secrets:
      - kibana_system_password,type=env,target=ELASTICSEARCH_PASSWORD
    env:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
      ELASTICSEARCH_USERNAME: kibana_system

# Prometheus ----------------------------------------------------------------------

- name: Write the Prometheus configuration
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ monitoring_root }}/prometheus/prometheus.yml"
    mode: "0644"
  notify: Restart prometheus

- name: Run Prometheus
  containers.podman.podman_container:
    name: prometheus
    image: "{{ monitoring_images.prometheus }}"
    state: started
    restart_policy: unless-stopped
    network:
      - "{{ monitoring_network }}"
    publish:
      - "{{ monitoring_bind_address }}:{{ monitoring_ports.prometheus }}:9090"
    memory: "{{ monitoring_prometheus_memory }}"
    volume:
      - "{{ monitoring_root }}/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time={{ monitoring_prometheus_retention }}

# Grafana -------------------------------------------------------------------------

- name: Write the Grafana data source (metrics only)
  ansible.builtin.template:
    src: grafana-datasources.yml.j2
    dest: "{{ monitoring_root }}/grafana/provisioning/datasources/datasources.yml"
    mode: "0644"
  notify: Restart grafana

- name: Run Grafana
  containers.podman.podman_container:
    name: grafana
    image: "{{ monitoring_images.grafana }}"
    state: started
    restart_policy: unless-stopped
    network:
      - "{{ monitoring_network }}"
    publish:
      - "{{ monitoring_bind_address }}:{{ monitoring_ports.grafana }}:3000"
    memory: "{{ monitoring_grafana_memory }}"
    volume:
      - "{{ monitoring_root }}/grafana/provisioning:/etc/grafana/provisioning:ro"
      - grafana-data:/var/lib/grafana
    secrets:
      - grafana_admin_password
    env:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
