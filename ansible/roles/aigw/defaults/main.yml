---
# aigw, the AI model gateway of PC Alentejo (ADR-0045). The image is built and published by the
# private 9dot5/ai-gateway repository on a version tag (v0.1.0) and pinned by digest. The host needs a
# `podman login ghcr.io` with a token that has read:packages to pull it.
aigw_image: ghcr.io/9dot5/ai-gateway:v0.1.0@sha256:878eeedeca120938381d64bab4fa287b78866b88e8e1addf845d4b34624cd20f
aigw_container_name: aigw

# Required, with no default: the paths hold the owner's account name and the Ollama address is a
# Tailscale address, and this repository is public (ADR-0025 rule 5). Paths are as the Podman
# machine sees them (C:\ is /mnt/c). The role mounts both files read-only and never reads them.
#   aigw_config_file:  config with the consumer key hashes (aigw.yaml)
#   aigw_secrets_file: provider keys, KEY=VALUE (secrets.env)
#   aigw_ollama_url:   Ollama as the Podman machine reaches it (the Tailscale IP, see runbook)
aigw_config_file: ""
aigw_secrets_file: ""
aigw_ollama_url: ""

# The container publishes on every interface of the Podman machine. Who can reach it (loopback and the
# Tailscale range only) is set outside Podman, by the Windows firewall rule and the Tailscale port proxy
# (ADR-0025 decision 3, aigw repo scripts/).
aigw_bind_address: 0.0.0.0
aigw_port: 4000
aigw_memory: 256m
# Public resolvers avoid the intermittent "no such host" of Podman's internal DNS for cloud API names.
# Addresses are passed in by the bootstrap script (-AigwDns); empty means the Podman default.
aigw_dns: []
