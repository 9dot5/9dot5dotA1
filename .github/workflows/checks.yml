name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Links, ADR headers, addresses and keys
        run: python .github/scripts/check_docs.py
      - name: Claude Code settings are valid JSON
        run: python -c "import json; json.load(open('.claude/settings.json', encoding='utf-8-sig'))"

  ops-mcp:
    name: Operations MCP tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Unit tests
        working-directory: ops-mcp
        run: python -m unittest discover -s tests -v

  ansible:
    name: Ansible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install pinned tools
        run: |
          pip install "ansible-core==2.21.5" "ansible-lint==26.10.1"
          ansible-galaxy collection install -r ansible/requirements.yml
      - name: Syntax check
        working-directory: ansible
        run: ansible-playbook --syntax-check site.yml
      - name: ansible-lint
        working-directory: ansible
        run: ansible-lint
